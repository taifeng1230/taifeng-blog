<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作台 — taifeng1230.cn</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ffffff'/%3E%3Cpath d='M16 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z' fill='%23c92a3d'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23f2b632'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>
  try {
    var qsTheme = new URLSearchParams(location.search).get("theme");
    var t = localStorage.getItem("tf_theme");
    if (qsTheme === "dark" || (!qsTheme && t && JSON.parse(t) === "dark")) document.documentElement.dataset.theme = "dark";
  } catch (e) {}
</script>
</head>
<body class="studio-body">
<header class="studio-nav">
  <a class="logo" href="index.html" aria-label="返回博客首页">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3l3.4 9.6L29 16l-9.6 3.4L16 29l-3.4-9.6L3 16l9.6-3.4z" fill="currentColor"/>
      <circle cx="16" cy="16" r="2.6" fill="var(--amber)"/>
    </svg>
    <span class="logo-text">taifeng1230<i>.cn</i><span class="logo-sub">写作台</span></span>
  </a>
  <div class="studio-actions">
    <button class="icon-btn" id="themeToggleStudio" aria-label="切换主题"></button>
    <a class="btn btn-ghost" href="index.html">返回博客</a>
  </div>
</header>

<main class="studio">
  <div class="studio-head">
    <h1>✦ 写文章</h1>
    <p>左边写、右边实时预览；点「生成代码」拿 posts.js 片段，或直接下载整份 posts.js。当前站内已有 <b id="existingCount">0</b> 篇文章。</p>
  </div>

  <div class="studio-grid">
    <section class="panel studio-form">
      <label for="eTitle">标题 *</label>
      <input id="eTitle" maxlength="60" placeholder="例如：从零搭一个静态博客是什么体验">

      <div class="studio-row">
        <div>
          <label for="eSlug">URL 标识 slug *</label>
          <input id="eSlug" maxlength="60" placeholder="hello-web（小写英文/数字/短横线）">
        </div>
        <div>
          <label for="eDate">日期 *</label>
          <input id="eDate" type="date">
        </div>
      </div>

      <label for="eTags">标签（逗号分隔，可点下方快捷标签）</label>
      <input id="eTags" maxlength="80" placeholder="前端, 工具">
      <div class="studio-tags" id="quickTags"></div>

      <label for="eExcerpt">摘要（一句话，卡片与搜索里显示；留空自动截取正文）</label>
      <textarea id="eExcerpt" maxlength="160" rows="2" placeholder="一两句话介绍这篇文章…"></textarea>

      <label for="eBody">正文（Markdown）*</label>
      <textarea id="eBody" placeholder="## 小节标题&#10;&#10;正文用 Markdown 写：**加粗**、`行内代码`、列表、引用…&#10;&#10;❈ 代码块提示：模板字符串里三反引号要转义，生成器会自动处理，照常输入 ``` 即可。"></textarea>
      <div class="studio-meta"><span id="charCount">0 字</span><span id="readTime">约 0 分钟</span></div>

      <div class="studio-actions-row">
        <button type="button" class="btn btn-ghost" id="demoBtn">填充示例</button>
        <button id="genBtn" class="btn btn-primary">生成代码</button>
        <button id="downloadBtn" class="btn btn-ghost" disabled>下载完整 posts.js</button>
      </div>
    </section>

    <section class="studio-side">
      <div class="panel">
        <h3>实时预览</h3>
        <div id="preview" class="md studio-preview"><p class="no-comment">开始输入标题和正文…</p></div>
      </div>
      <div class="panel" id="outputPanel" hidden>
        <h3>生成的代码 <span class="section-sub">粘到 js/posts.js 数组里（上一个对象后加逗号）</span></h3>
        <div class="code-block">
          <div class="code-head">
            <span class="code-dots"><i></i><i></i><i></i></span>
            <span class="code-lang">JS · 片段</span>
            <button class="copy-btn" id="copySnippet"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>复制</span></button>
          </div>
          <pre><code id="snippet"></code></pre>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<script src="js/posts.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
